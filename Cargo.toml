[package]
name = "reboop"
version = "0.1.0"
edition = "2024"

[dependencies]
anstream = "1"
anyhow = "1"
base64 = "0.23"
chacha20poly1305 = "0.11"
clap = { version = "4", features = ["derive"] }
getrandom = "0.4"
json5 = "1"
libc = "0.2"
mimalloc = { version = "0.1", default-features = false } # Turn off the default secure mode
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
libtest-mimic = "0.8"
tempfile = "3"

# Runs against a NixOS VM; see tests/vm/main.rs.
[[test]]
name = "vm"
harness = false

[profile.dev]
# Reduce debug rebuild time
# https://github.com/rust-gamedev/wg/issues/50#issuecomment-527160611
debug = false

# Optimize our dependencies (but not our own crate to avoid long rebuild times)
[profile.dev.package."*"]
opt-level = 3

# Optimize build scripts and proc-macros
[profile.dev.build-override]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
